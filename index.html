<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة ناش تكا | Nash Tikka Company</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #b31923;
            --secondary: #221515;
            --accent: #d4ac0d;
            --dark: #1a1a1a;
            --gray: #666;
            --snok-color: #381415;
            --bg-color: #faf8f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--dark); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: var(--secondary); color: white; padding: 1.2rem 25px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); }
        .logo-area h1 { font-size: 1.5rem; color: #fff; font-weight: 700; }
        .menu-icon { font-size: 1.7rem; cursor: pointer; color: white; }

        .side-menu { position: fixed; top: 0; right: -100%; width: 320px; height: 100%; background: #fff; box-shadow: -5px 0 25px rgba(0,0,0,0.2); z-index: 2000; transition: right 0.3s ease-in-out; display: flex; flex-direction: column; justify-content: space-between; padding: 30px 20px; text-align: center; }
        .side-menu.open { right: 0; }
        .close-btn { font-size: 1.8rem; cursor: pointer; color: var(--secondary); align-self: flex-end; }
        
        .side-nav-links { list-style: none; display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .side-nav-links li a { font-size: 1.2rem; font-weight: 600; color: var(--secondary); text-decoration: none; padding: 10px; border-radius: 6px; display: block; cursor: pointer; }
        .side-nav-links li a:hover { background: #f1f1f1; color: var(--primary); }
        
        .lang-switch { cursor: pointer; font-size: 1.1rem; font-weight: bold; color: var(--primary); margin: 15px 0; padding: 8px; border: 1px dashed var(--primary); border-radius: 6px; display: inline-block; }

        .hero { color: white; padding: 120px 20px; text-align: center; background-color: var(--secondary); border-bottom: 5px solid var(--primary); }
        .hero h2 { font-size: 2.8rem; margin-bottom: 20px; color: #fff; }
        .hero p { font-size: 1.2rem; margin-bottom: 30px; max-width: 700px; margin-left: auto; margin-right: auto; }
        
        .section { padding: 60px 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { font-size: 2.2rem; color: var(--secondary); position: relative; display: inline-block; padding-bottom: 10px; }
        .section-title h2::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80px; height: 3px; background: var(--primary); }
        
        .brands-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .brand-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); text-align: center; padding: 30px; border-top: 5px solid var(--primary); }
        .brand-card.snok { border-top-color: var(--snok-color); }
